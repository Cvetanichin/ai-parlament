<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Workspace</title>
<meta name="description" content="Local-first personal workspace: tasks, projects, deadlines and prompt-defined AI agents.">
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#1b2430;--muted:#5b6675;--line:#dfe3e9;--accent:#2f5d8a;--accent-ink:#fff;--ok:#2d7a4f;--warn:#a86a00;--bad:#b3261e;--radius:10px;--gap:16px;--pad:16px}
:root[data-theme="dark"]{--bg:#12161c;--panel:#1b212a;--ink:#e8ecf1;--muted:#9aa5b4;--line:#2c3541;--ok:#5cc08a;--warn:#e0a63a;--bad:#f2766d}
:root[data-theme="contrast"]{--bg:#fff;--panel:#fff;--ink:#000;--muted:#222;--line:#000;--ok:#005a1f;--warn:#6b3d00;--bad:#8a0000}
:root[data-density="compact"]{--gap:10px;--pad:10px;--radius:6px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav.side{background:var(--panel);border-right:1px solid var(--line);padding:var(--pad);position:sticky;top:0;height:100vh;overflow:auto}
nav.side h1{font-size:16px;margin:0 0 12px}
nav.side a{display:flex;justify-content:space-between;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none}
nav.side a:hover{background:var(--bg)}
nav.side a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
nav.side .grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 10px 4px}
.badge{background:var(--bad);color:#fff;border-radius:99px;padding:0 7px;font-size:12px}
main{padding:calc(var(--pad)*1.5);max-width:1200px;width:100%}
header.top{display:flex;gap:var(--gap);align-items:center;margin-bottom:var(--gap);flex-wrap:wrap}
header.top h2{margin:0;flex:1;font-size:22px}
.grid{display:grid;gap:var(--gap);grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:var(--pad)}
.card h3{margin:0 0 8px;font-size:15px}
.card.wide{grid-column:1/-1}
.muted{color:var(--muted)}.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row.between{justify-content:space-between}
.stack>*+*{margin-top:var(--gap)}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.danger{color:var(--bad)}
button:disabled{opacity:.5;cursor:not-allowed}
button.link{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
input[type=checkbox],input[type=radio]{width:auto;flex:none;margin-top:4px}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 3px}
label.inline{display:inline-flex;gap:6px;align-items:center;font-weight:400;font-size:14px;margin:0}
label.inline input{width:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.tag{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:0 8px;font-size:12px;color:var(--muted)}
.tag.bad{color:var(--bad);border-color:var(--bad)}.tag.warn{color:var(--warn);border-color:var(--warn)}.tag.ok{color:var(--ok);border-color:var(--ok)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list .grow{flex:1;min-width:0}
.done .t{text-decoration:line-through;color:var(--muted)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
.bar.over>i{background:var(--bad)}
.out{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:var(--pad);overflow:auto;max-height:70vh}
.out h1,.out h2,.out h3{margin:.9em 0 .3em}.out p{margin:.5em 0}
.out pre,pre.raw{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;white-space:pre-wrap;font-size:13px}
.out blockquote{border-left:3px solid var(--line);margin:.5em 0;padding-left:12px;color:var(--muted)}
.split{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:var(--gap);align-items:start}
.banner{border:1px solid var(--warn);color:var(--warn);background:var(--panel);border-radius:var(--radius);padding:10px 14px;margin-bottom:var(--gap)}
.add-del{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.diff .add{background:color-mix(in srgb,var(--ok) 20%,transparent)}.diff .del{background:color-mix(in srgb,var(--bad) 20%,transparent);text-decoration:line-through}
.diff div{white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:13px;padding:0 6px}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:50;max-width:min(360px,calc(100vw - 32px))}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px}
dialog{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);color:var(--ink);max-width:min(760px,94vw);width:100%}
dialog::backdrop{background:#0008}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;background:var(--panel);padding:6px;z-index:99}
@media (max-width:820px){.app{grid-template-columns:1fr}nav.side{position:static;height:auto;display:flex;flex-wrap:wrap;gap:4px;border-right:0;border-bottom:1px solid var(--line)}nav.side h1,nav.side .grp{display:none}.split{grid-template-columns:1fr}main{padding:var(--pad)}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="app">
  <nav class="side" id="nav" aria-label="Main"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<div id="toasts" role="status" aria-live="polite"></div>
<dialog id="dlg"></dialog>

<script>
"use strict";
const BUILTIN_AGENTS = [{"id":"writer","name":"Creative Writing Agent","description":"Blog posts, long reads and social updates from a topic, tone and style guide.","fields":[{"key":"format","label":"Format","type":"select","options":["Blog post (600-900 words)","Long read (1,800-2,500 words)","Social set (LinkedIn post + 3 short posts)","Newsletter intro (200-300 words)"],"default":"Blog post (600-900 words)"},{"key":"topic","label":"Topic and angle","type":"textarea","placeholder":"What is it about, and what is the one thing the reader should take away?"},{"key":"audience","label":"Audience","type":"text","placeholder":"e.g. programme officers at EU-funded CSOs"},{"key":"tone","label":"Tone","type":"select","options":["Strategic minimalist","Warm and personal","Analytical","Provocative","Plain and practical"],"default":"Strategic minimalist"},{"key":"style","label":"Style guide / voice notes","type":"textarea","placeholder":"Paste house style, sample paragraph, banned phrases, must-use terms (optional)"},{"key":"material","label":"Source material and facts you want used","type":"textarea","placeholder":"Notes, quotes, data you have verified (optional). The agent will not invent facts."}],"template":"FORMAT: {{format}}\nTOPIC AND ANGLE: {{topic}}\nAUDIENCE: {{audience}}\nTONE: {{tone}}\nSTYLE GUIDE: {{style}}\nSOURCE MATERIAL: {{material}}","system":"# Role\nYou are the Creative Writing Agent inside a consultant's personal workspace. The user works in civil society, human rights, digital rights, ethical AI, monitoring and evaluation, and donor-funded programmes. You write publishable first drafts that need light editing, not outlines.\n\n# Inputs\nThe user message supplies: FORMAT, TOPIC AND ANGLE, AUDIENCE, TONE, STYLE GUIDE, SOURCE MATERIAL. Blank fields mean \"no preference\".\n\n# Operating rules\n1. Write in British English.\n2. Never invent facts, statistics, quotations, names, studies or URLs. Use only SOURCE MATERIAL for factual claims. If a claim is needed but unsupported, write it as a placeholder in the form `[VERIFY: what is needed]`.\n3. Ask a question only if the topic is so unclear that a draft would be guesswork. Otherwise proceed and list assumptions at the end.\n4. Lead with the reader's problem or the sharpest insight. One central argument per piece.\n5. Follow STYLE GUIDE exactly when given. If TONE is \"Strategic minimalist\": short paragraphs, active voice, high information density, no filler, no marketing clichés, no exaggerated claims.\n6. Avoid: \"in today's fast-paced world\", \"game-changer\", \"unlock\", \"delve\", \"landscape\" as filler, rhetorical-question openers, and emojis (unless the style guide asks for them).\n7. Do not claim personal experiences or client results the user has not supplied.\n\n# Format rules\n- Blog post: headline, 600-900 words, 3-5 subheadings, one closing takeaway or call to action.\n- Long read: headline, standfirst (one sentence), 1,800-2,500 words, clear section headings, an evidence-led argument, a \"What this means in practice\" section.\n- Social set: one LinkedIn post (120-200 words, strong first line, no hashtag stuffing, at most 3 hashtags) plus three shorter standalone posts under 280 characters, each with a different angle.\n- Newsletter intro: 200-300 words, one hook, one link-worthy takeaway.\n\n# Output structure\n1. `## Headline options` — three options, one line each.\n2. `## Draft` — the piece, in Markdown.\n3. `## Editor's notes` — bullets: assumptions made; every `[VERIFY]` item; one alternative angle; one cut if the piece must be shorter.\n\n# Quality check before answering\nConfirm: no invented facts; word count within range; tone matches; every unsupported claim is marked."},{"id":"researcher","name":"Research and Analysis Agent","description":"Structured briefs with evidence grading, a source register and explicit gaps.","fields":[{"key":"question","label":"Research question","type":"textarea","placeholder":"State the decision this research should inform."},{"key":"scope","label":"Scope and constraints","type":"textarea","placeholder":"Geography, period, sectors, what is out of scope (optional)"},{"key":"depth","label":"Output","type":"select","options":["One-page brief","Full brief with data table","Research plan only (what to look for, where)"],"default":"One-page brief"},{"key":"sources","label":"Sources and data you have (paste text, links, figures)","type":"textarea","placeholder":"The agent cites only what you paste here or labels the claim as unverified training knowledge."}],"template":"RESEARCH QUESTION: {{question}}\nSCOPE AND CONSTRAINTS: {{scope}}\nOUTPUT: {{depth}}\nSOURCES PROVIDED BY USER:\n{{sources}}","system":"# Role\nYou are the Research and Analysis Agent inside a consultant's personal workspace. You compile, compare and summarise evidence so the user can make a decision. You are an analyst, not an advocate.\n\n# Inputs\nThe user message supplies: RESEARCH QUESTION, SCOPE AND CONSTRAINTS, OUTPUT type, and SOURCES PROVIDED BY USER (pasted text, links, figures).\n\n# Hard constraints\n1. You cannot browse the web in this workspace. Never present a source, URL, author, date or statistic as found unless it appears in SOURCES PROVIDED BY USER.\n2. Never fabricate citations. If you rely on general knowledge, label it `Training knowledge (unverified)` and add it to the verification list.\n3. Use British English. State uncertainty explicitly.\n\n# Method\n1. Restate the question in one sentence and name the decision it informs. If the question cannot support a decision, say so and suggest a sharper question.\n2. Define scope: included, excluded, period, geography.\n3. Extract claims from the provided sources. For each key claim record: claim, source, date (if stated), type (primary data, official report, academic, media, opinion), and an evidence grade:\n   - A: primary or official data, method visible\n   - B: credible secondary source, method partly visible\n   - C: opinion, anecdote, or unverified training knowledge\n4. Compare sources; call out contradictions and say which you weight more, and why.\n5. Separate clearly: **Facts** (graded), **Assumptions**, **Interpretations**, **Recommendations**.\n\n# Output structure\n- `## Bottom line` — three sentences maximum.\n- `## Key findings` — numbered, each with its evidence grade.\n- `## Data and figures` — a Markdown table: Metric | Value | Source | Date | Grade (only if figures were provided; otherwise state \"none provided\").\n- `## Gaps and uncertainties` — what is missing and how it could change the conclusion.\n- `## Recommendations` — actions, each tied to a finding number.\n- `## Source register` — Source | What it supports | Type | Grade. Only user-provided sources.\n- `## To verify next` — specific searches or documents to obtain, with suggested source types.\n\nIf OUTPUT is \"Research plan only\", replace the middle sections with: sub-questions, priority sources by type, search strings, inclusion criteria, and a 5-step collection plan.\nIf OUTPUT is \"One-page brief\", keep the whole answer under 450 words."},{"id":"drafter","name":"Project Drafting Agent","description":"Turns an idea into a structured outline, work plan and first-fortnight tasks.","emitsTasks":true,"fields":[{"key":"template","label":"Template","type":"select","options":["Generic project","Donor-funded programme (logframe)","Product MVP","Consulting engagement","Event or campaign"],"default":"Generic project"},{"key":"idea","label":"Project idea and objective","type":"textarea","placeholder":"What should be different when this succeeds, and for whom?"},{"key":"start","label":"Start date","type":"text","placeholder":"YYYY-MM-DD"},{"key":"end","label":"Hard end date or deadline","type":"text","placeholder":"YYYY-MM-DD (optional)"},{"key":"constraints","label":"Budget, team, constraints","type":"textarea","placeholder":"Optional"}],"template":"TEMPLATE: {{template}}\nIDEA AND OBJECTIVE: {{idea}}\nSTART DATE: {{start}}\nEND DATE: {{end}}\nCONSTRAINTS: {{constraints}}","system":"# Role\nYou are the Project Drafting Agent inside a consultant's personal workspace. You turn an idea into a structured, realistic project outline and a first-fortnight task list. You work for an independent consultant, so favour small teams, low-code and AI-native approaches before custom engineering.\n\n# Inputs\nThe user message supplies: TEMPLATE, IDEA AND OBJECTIVE, START DATE, END DATE, CONSTRAINTS. Today's date is provided in the workspace context line.\n\n# Operating rules\n1. British English. Concise, institutional tone. No filler.\n2. Begin with the user, the problem and the smallest valuable outcome.\n3. Never blur these concepts. Keep them in separate sections: problem, need, objective, outcome, output, activity, indicator, baseline, target, means of verification, assumption, risk.\n4. Do not invent facts about the user's organisation, budget or partners. Where information is missing, list it under \"Information needed\" and proceed with a labelled assumption.\n5. Flag weak logic: outputs presented as outcomes, indicators without baselines, activities that do not lead to the stated outcome, unrealistic timelines.\n6. Dates must be real calendar dates in YYYY-MM-DD. If END DATE is blank, propose one and say so.\n\n# Template behaviour\n- Generic project: problem, objective, scope in/out, deliverables, milestones, risks.\n- Donor-funded programme (logframe): impact, outcomes, outputs, activities, with indicators, baseline, target and means of verification for each outcome and output; assumptions at each level; risk register. Use EU Logical Framework conventions.\n- Product MVP: user, problem, smallest valuable outcome, MVP scope, explicitly excluded features, validation plan, build approach (no-code/low-code first), launch checklist.\n- Consulting engagement: client need, scope, deliverables, approach, assumptions, dependencies on the client, fee-neutral resourcing, review points.\n- Event or campaign: audience, objective, message, channels, run-of-show or content calendar, owners, contingency.\n\n# Output structure\n1. `## Summary` — five lines.\n2. `## Information needed` — questions that would materially change the plan.\n3. `## Outline` — per the template above.\n4. `## Work plan` — table: Phase | Milestone | Date | Dependency.\n5. `## Risks and assumptions` — table with likelihood, impact, mitigation.\n6. `## First fortnight` — the next actions in order.\n7. A final fenced block tagged `workspace-tasks` containing a JSON array the workspace can import. Include 6-12 tasks maximum. Schema exactly:\n\n```workspace-tasks\n[\n  {\"title\": \"string, starts with a verb\", \"due\": \"YYYY-MM-DD\", \"effort\": 2, \"priority\": 2, \"notes\": \"string\"}\n]\n```\n`effort` is hours (number). `priority` is 1 (low), 2 (normal) or 3 (high). Output nothing after the block."},{"id":"deadlines","name":"Deadline Tracking Agent","description":"Prioritises open work against capacity, flags conflicts and proposes date changes you can apply.","emitsUpdates":true,"includeContext":true,"fields":[{"key":"focus","label":"What do you need?","type":"select","options":["Replan my next 7 days","Find conflicts and overload","Draft messages to renegotiate deadlines","Weekly review"],"default":"Replan my next 7 days"},{"key":"notes","label":"Constraints this period","type":"textarea","placeholder":"Travel, leave, fixed meetings, energy levels (optional)"}],"template":"REQUEST: {{focus}}\nCONSTRAINTS THIS PERIOD: {{notes}}","system":"# Role\nYou are the Deadline Tracking Agent inside a consultant's personal workspace. You protect the user's commitments by prioritising open work against real capacity, surfacing conflicts early, and proposing changes the user can accept or reject. You do not make changes yourself.\n\n# Inputs\nThe user message supplies: REQUEST, CONSTRAINTS THIS PERIOD, and a WORKSPACE SNAPSHOT (JSON): today's date, daily capacity in hours, open tasks (id, title, project, due, effort, priority, status), projects, and calendar events. Treat the snapshot as the only source of truth. Never invent tasks, dates or ids.\n\n# Method\n1. Compute workload: hours of effort due in each of the next 7 days against capacity. Overdue tasks count against today.\n2. Classify every open task:\n   - **Do now**: overdue, or due within 48 hours, or high priority and blocking others\n   - **This week**: due within 7 days\n   - **Schedule**: due later, needs a time block\n   - **Renegotiate or drop**: low priority and cannot fit without displacing higher priorities\n3. Detect: overload (hours > capacity), clustering (three or more deadlines on one day), tasks with no due date, tasks with no effort estimate, calendar events that remove capacity.\n4. Apply the principle: protect deadlines with external consequences first; move internal deadlines before external ones; prefer one decisive change over many small ones.\n5. Be explicit about uncertainty. If effort estimates are missing, say that the plan is unreliable and ask for estimates.\n\n# Output structure (British English, concise)\n- `## Status` — one line: on track / at risk / overloaded, with the numbers.\n- `## Priorities` — the four buckets as short lists, with task titles and due dates.\n- `## Conflicts and risks` — bullets, each with the evidence from the snapshot.\n- `## Proposed plan` — a day-by-day table for the next 7 days: Day | Tasks | Hours.\n- `## Recommendations` — numbered, most impactful first, each saying what to change and why.\n- If REQUEST is \"Draft messages to renegotiate deadlines\": add short, courteous, ready-to-send messages with a proposed new date and reason. Never send; the user decides.\n- If REQUEST is \"Weekly review\": add what was completed, what slipped, and one process improvement.\n- Finish with a fenced block tagged `workspace-updates`, a JSON array of proposed changes to existing tasks. Use only ids from the snapshot. Include only fields that change. Maximum 10 items. Schema:\n\n```workspace-updates\n[\n  {\"id\": \"task id from snapshot\", \"due\": \"YYYY-MM-DD\", \"priority\": 3, \"note\": \"reason in one sentence\"}\n]\n```\nOutput nothing after the block. If no changes are justified, output an empty array."}];
const APP_VERSION = "1.1.2";
const SCHEMA_VERSION = 1;

/* ---------- tiny helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "value") el.value = v;
    else if (v === true) el.setAttribute(k, "");
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
}
const pad2 = (n) => String(n).padStart(2, "0");
const isoDate = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const today = () => isoDate(new Date());
const parseDay = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const daysUntil = (s) => Math.round((parseDay(s) - parseDay(today())) / 864e5);
const addDays = (s, n) => { const d = parseDay(s); d.setDate(d.getDate() + n); return isoDate(d); };
const validDay = (s) => typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(parseDay(s));
const fmtDay = (s) => s ? parseDay(s).toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }) : "No date";
const dueLabel = (s) => { if (!s) return "No date"; const d = daysUntil(s); return d < 0 ? `${-d}d overdue` : d === 0 ? "Today" : d === 1 ? "Tomorrow" : `In ${d}d`; };
const el$ = (id) => $("#" + id);

function toast(msg) {
  const t = h("div", { class: "toast" }, msg);
  el$("toasts").append(t); setTimeout(() => t.remove(), 4500);
}
function download(name, text, type = "text/plain") {
  const a = h("a", { href: URL.createObjectURL(new Blob([text], { type })), download: name });
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
async function copy(text, okMsg = "Copied") {
  try { await navigator.clipboard.writeText(text); toast(okMsg); }
  catch { const ta = h("textarea", { value: text }); document.body.append(ta); ta.select(); document.execCommand("copy"); ta.remove(); toast(okMsg); }
}
function pickFile(accept) {
  return new Promise((res) => {
    const i = h("input", { type: "file", accept, onchange: () => res(i.files[0] || null) });
    i.click();
  });
}
const readText = (f) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsText(f); });

/* ---------- minimal, safe markdown ---------- */
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
}
function md(src) {
  const lines = src.replace(/\r/g, "").split("\n"); let out = "", i = 0, list = null;
  const closeList = () => { if (list) { out += `</${list}>`; list = null; } };
  while (i < lines.length) {
    const l = lines[i];
    if (/^```/.test(l)) { closeList(); const buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]); i++; out += `<pre>${esc(buf.join("\n"))}</pre>`; continue; }
    if (/^\|.*\|\s*$/.test(l) && /^\|[\s:|-]+\|\s*$/.test(lines[i + 1] || "")) {
      closeList(); const cells = (r) => r.trim().replace(/^\||\|$/g, "").split("|").map((c) => inline(c.trim()));
      out += "<table><thead><tr>" + cells(l).map((c) => `<th>${c}</th>`).join("") + "</tr></thead><tbody>"; i += 2;
      while (i < lines.length && /^\|.*\|\s*$/.test(lines[i])) out += "<tr>" + cells(lines[i++]).map((c) => `<td>${c}</td>`).join("") + "</tr>";
      out += "</tbody></table>"; continue;
    }
    let m;
    if ((m = l.match(/^(#{1,4})\s+(.*)/))) { closeList(); out += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; }
    else if ((m = l.match(/^\s*[-*]\s+(.*)/))) { if (list !== "ul") { closeList(); out += "<ul>"; list = "ul"; } out += `<li>${inline(m[1])}</li>`; }
    else if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== "ol") { closeList(); out += "<ol>"; list = "ol"; } out += `<li>${inline(m[1])}</li>`; }
    else if (/^>\s?/.test(l)) { closeList(); out += `<blockquote>${inline(l.replace(/^>\s?/, ""))}</blockquote>`; }
    else if (/^---+\s*$/.test(l)) { closeList(); out += "<hr>"; }
    else if (!l.trim()) closeList();
    else { closeList(); out += `<p>${inline(l)}</p>`; }
    i++;
  }
  closeList(); return out;
}
const mdBox = (text, cls = "out") => { const d = h("div", { class: cls }); d.innerHTML = md(text); return d; };

/* ---------- storage: IndexedDB with localStorage fallback ---------- */
const DB = {
  db: null,
  open() {
    return new Promise((res) => {
      try {
        const r = indexedDB.open("personal-workspace", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("kv");
        r.onsuccess = () => { this.db = r.result; res(); };
        r.onerror = () => res();
      } catch { res(); }
    });
  },
  get(k) {
    return new Promise((res) => {
      if (!this.db) { try { res(JSON.parse(localStorage.getItem("pw:" + k))); } catch { res(null); } return; }
      const r = this.db.transaction("kv").objectStore("kv").get(k);
      r.onsuccess = () => res(r.result ?? null); r.onerror = () => res(null);
    });
  },
  set(k, v) {
    return new Promise((res) => {
      if (!this.db) { try { localStorage.setItem("pw:" + k, JSON.stringify(v)); } catch { toast("Storage full or blocked: export a backup now."); } res(); return; }
      const t = this.db.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k);
      t.oncomplete = () => res(); t.onerror = () => { toast("Could not save. Export a backup now."); res(); };
    });
  },
};

/* ---------- deadline logic (local, works offline) ---------- */
function weekdaysFrom(start, n) { let c = 0; for (let i = 0; i < n; i++) { const w = parseDay(addDays(start, i)).getDay(); if (w !== 0 && w !== 6) c++; } return c; }
function triage() {
  const open = S.tasks.filter((t) => t.status !== "done");
  const scored = open.map((t) => {
    const d = t.due ? daysUntil(t.due) : 30;
    const urgency = d < 0 ? 100 + Math.min(-d, 20) * 3 : Math.max(0, 70 - d * 7);
    return { t, d, score: urgency * (0.6 + 0.2 * (t.priority || 2)) };
  }).sort((a, b) => b.score - a.score);
  const bucket = (x) => x.d < 0 ? "overdue" : x.d <= 1 ? "now" : x.d <= 7 ? "week" : "later";
  const groups = { overdue: [], now: [], week: [], later: [] };
  scored.forEach((x) => groups[bucket(x)].push(x));
  const due7 = open.filter((t) => t.due && daysUntil(t.due) <= 7);
  const hours = due7.reduce((s, t) => s + (Number(t.effort) || 0), 0);
  const capacity = weekdaysFrom(today(), 7) * S.settings.hoursPerDay;
  const missingEffort = open.filter((t) => !t.effort).length;
  const clusters = {}; open.forEach((t) => { if (t.due) clusters[t.due] = (clusters[t.due] || 0) + 1; });
  const crowded = Object.entries(clusters).filter(([d, n]) => n >= 3 && daysUntil(d) >= 0 && daysUntil(d) <= 14).map(([d, n]) => ({ d, n }));
  return { groups, hours, capacity, missingEffort, crowded, overdueCount: groups.overdue.length };
}
function attentionCount() { const g = triage().groups; return g.overdue.length + g.now.length; }

/* ---------- reminders ---------- */
function checkReminders() {
  const day = today(); S.fired = Object.fromEntries(Object.entries(S.fired).filter(([k]) => k.endsWith(day)));
  const msgs = [];
  for (const t of S.tasks) {
    if (t.status === "done" || !t.due) continue;
    const d = daysUntil(t.due);
    const lead = d < 0 ? -1 : d;
    if (d >= 0 && !S.settings.leadDays.includes(d)) continue;
    const key = `${t.id}:${lead}:${day}`;
    if (S.fired[key]) continue; S.fired[key] = 1;
    msgs.push(`${t.title}: ${dueLabel(t.due).toLowerCase()}`);
  }
  if (!msgs.length) return;
  save();
  const text = msgs.length > 3 ? `${msgs.length} deadlines need attention` : msgs.join(" | ");
  toast(text);
  if (S.settings.notify && "Notification" in window && Notification.permission === "granted") { try { new Notification("Workspace reminder", { body: text }); } catch {} }
}

/* ---------- calendar (ICS) ---------- */
function parseICS(text) {

    if (l === "BEGIN:VEVENT") cur = {};
    else if (l === "END:VEVENT") { if (cur?.start) events.push(cur); cur = null; }
    else if (cur) {
      const i = l.indexOf(":"); if (i < 0) continue;
      const [name] = l.slice(0, i).split(";"), val = l.slice(i + 1);
      if (name === "SUMMARY") cur.title = val.replace(/\\,/g, ",").replace(/\\n/g, " ");

      else if (name === "RRULE") { cur.recurring = true; recurring++; }

        if (m[6]) d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3], +(m[4] || 0), +(m[5] || 0)));

}

  const re = (() => { try { return new RegExp(S.settings.icsDeadlineRegex, "i"); } catch { return null; } })();
  for (const e of events) {
    const key = `${e.uid || e.title}|${e.start}`;
    if (S.events.some((x) => x.key === key)) continue;
    S.events.push({ id: "e" + cyrb53(key).toString(36), key, title: e.title || "(untitled)", start: e.start, time: e.time }); added++;
    if (re && re.test(e.title || "") && !S.tasks.some((t) => t.icsKey === key)) {
      S.tasks.push(newTask({ id: "c" + cyrb53(key).toString(36), title: e.title, due: e.start, notes: "Imported from calendar", source: "calendar", icsKey: key })); tasks++;
    }
  }

}

  const esc2 = (s) => (s || "").replace(/([,;\\])/g, "\\$1").replace(/\n/g, "\\n");
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
  const out = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Personal Workspace//EN", "CALSCALE:GREGORIAN"];

    const s = t.due.replace(/-/g, ""), e = addDays(t.due, 1).replace(/-/g, "");
    out.push("BEGIN:VEVENT", `UID:${t.id}@personal-workspace`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${s}`, `DTEND;VALUE=DATE:${e}`,
      `SUMMARY:${esc2("Due: " + t.title)}`, `DESCRIPTION:${esc2(t.notes)}`);
    for (const trig of ["-P3D", "-P1D"]) out.push("BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${esc2(t.title)}`, `TRIGGER:${trig}`, "END:VALARM");

/* ---------- docs / versions / search ---------- */
function saveDoc(doc, content, note) {

  doc.versions.push({ ts: Date.now(), content, note: note || "" });
  if (doc.versions.length > 30) doc.versions.splice(0, doc.versions.length - 30);
  save(); return true;
}
const addDoc = (title, content, tags = [], note = "Created") => { const d = { id: uid(), title, tags, projectId: "", created: Date.now(), versions: [] }; saveDoc(d, content, note); S.docs.unshift(d); save(); return d; };
const docText = (d) => d.versions[d.versions.length - 1]?.content || "";
function search(q) {
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean); if (!terms.length) return [];

  for (const d of S.docs) { const s = score(d.title.toLowerCase(), 5) + score(d.tags.join(" ").toLowerCase(), 3) + score(docText(d).toLowerCase(), 1); if (s >= terms.length) res.push({ kind: "doc", s, d }); }

/* ---------- metrics ---------- */
function metrics(days = 30) {
  const since = Date.now() - days * 864e5;
  const done = S.tasks.filter((t) => t.status === "done" && t.completedAt >= since);
  const onTime = done.filter((t) => t.due && t.completedAt <= parseDay(addDays(t.due, 1)).getTime());
  const withDue = done.filter((t) => t.due);
  const created = S.tasks.filter((t) => t.created >= since).length;
  const open = S.tasks.filter((t) => t.status !== "done");
  const runs = S.runs.filter((r) => r.ts >= since);
  const byAgent = {};
  for (const r of runs) { const a = (byAgent[r.agent] ||= { runs: 0, ms: 0, tok: 0, up: 0, down: 0, accepted: 0, errors: 0 }); a.runs++; a.ms += r.ms || 0; a.tok += (r.inTok || 0) + (r.outTok || 0); if (r.rating === 1) a.up++; if (r.rating === -1) a.down++; if (r.accepted) a.accepted++; if (r.error) a.errors++; }

}
function insights(m) {
  const tips = [];
  if (m.overdue) tips.push(`${m.overdue} task(s) are overdue. Reschedule or drop them today; overdue items distort every plan.`);
  if (m.noEffort > 3) tips.push(`${m.noEffort} open tasks have no effort estimate. The workload check is unreliable until you add them.`);
  if (m.noDate > 5) tips.push(`${m.noDate} open tasks have no due date and will never surface in reminders. Date them or move them to a someday list.`);
  if (m.onTimeRate != null && m.onTimeRate < 70) tips.push(`On-time completion is ${m.onTimeRate}%. Consider shorter planning horizons or padding estimates by 25%.`);
  if (m.created > m.done * 1.5 && m.created > 5) tips.push(`You created ${m.created} tasks but completed ${m.done}. The backlog is growing; run a weekly review.`);
  for (const [id, a] of Object.entries(m.byAgent)) {
    const name = agentById(id)?.name || id;
    if (a.down > a.up && a.down >= 2) tips.push(`${name} is rated negatively more than positively. Refine its system prompt in Settings or the agents/ folder.`);
    if (a.errors > a.runs / 3) tips.push(`${name} fails often (${a.errors}/${a.runs}). Check the API key, model name and max tokens.`);
    if (a.runs >= 3 && a.accepted / a.runs < 0.3) tips.push(`Few ${name} outputs are saved or imported (${a.accepted}/${a.runs}). Tighten the inputs you give it.`);
  }

  return tips;
}

      if (arr) { const i = arr.findIndex((x) => x.id === r.id); if (i >= 0) { arr.splice(i, 1); changed++; docsTouched ||= r.kind === "doc"; } }
      sy.meta[key] = { deleted: true, u: Math.max(R, m ? m.u : 0), dirty: false };
      continue;
    }
    const rh = hashOf(r.data);
    if (m && !m.deleted && m.h === rh) { m.u = Math.max(m.u, R); m.dirty = false; continue; } // already identical
    if (m && m.u > R) continue; // local is newer; the push will carry it
    if (r.kind === "settings") { applyRemoteSettings(r.data); sy.meta[key] = { h: hashOf(pickSettings()), u: R, dirty: false }; changed++; applyTheme(); continue; }
    const rec = fromRemote(r.kind, r.id, r.data);
    if (!rec) continue;
    // The same calendar entry imported on two devices must not appear twice.
    if (r.kind === "event" && S.events.some((e) => e.key === rec.key && e.id !== rec.id)) { sy.meta[key] = { deleted: true, u: R, dirty: false }; continue; }
    const i = arr.findIndex((x) => x.id === r.id);
    if (i >= 0) arr[i] = rec; else arr.push(rec);
    sy.meta[key] = { h: hashOf(rec), u: R, dirty: false };
    changed++; docsTouched ||= r.kind === "doc";
  }
  if (docsTouched) S.docs.sort((a, b) => (b.created || 0) - (a.created || 0));
  return changed;
}

/* HTTP */
async function netFetch(url, init) {
  try { return await fetch(url, init); }
  catch { const e = new Error("Network unreachable"); e.offline = true; throw e; }
}
async function syncAuthFetch(path, body, token) {
  const r = await netFetch(S.sync.url + path, { method: "POST", headers: { apikey: S.sync.anonKey, "content-type": "application/json", ...(token ? { authorization: `Bearer ${token}` } : {}) }, body: JSON.stringify(body) });
  const text = await r.text(); let j = {}; try { j = text ? JSON.parse(text) : {}; } catch { /* not JSON */ }
  if (!r.ok) { const e = new Error(j.msg || j.error_description || j.message || j.error || `HTTP ${r.status}`); e.status = r.status; throw e; }
  return j;
}
const toSession = (j, email) => ({ access_token: j.access_token, refresh_token: j.refresh_token, expires_at: j.expires_at || Math.floor(Date.now() / 1000) + (j.expires_in || 3600), email: j.user?.email || email, uid: j.user?.id });
function syncRefresh() {
  if (sync.refreshing) return sync.refreshing;
  sync.refreshing = (async () => {
    try {
      const j = await syncAuthFetch("/auth/v1/token?grant_type=refresh_token", { refresh_token: S.sync.session.refresh_token });
      S.sync.session = toSession(j, S.sync.session.email); save();
    } catch (e) {
      if (e.status === 400 || e.status === 401) { S.sync.session = null; save(); throw new Error("Session expired. Sign in again."); }
      throw e;
    } finally { sync.refreshing = null; }
  })();
  return sync.refreshing;
}
async function syncReq(method, path, body, headers = {}) {
  if (!S.sync.session) throw new Error("Not signed in");
  if (S.sync.session.expires_at - 60 < Date.now() / 1000) await syncRefresh();
  const go1 = () => netFetch(S.sync.url + path, { method, headers: { apikey: S.sync.anonKey, authorization: `Bearer ${S.sync.session.access_token}`, accept: "application/json", ...(body !== undefined ? { "content-type": "application/json" } : {}), ...headers }, body: body !== undefined ? JSON.stringify(body) : undefined });
  let r = await go1();
  if (r.status === 401) { await syncRefresh(); r = await go1(); }
  const text = await r.text(); let j = null; try { j = text ? JSON.parse(text) : null; } catch { /* not JSON */ }
  if (!r.ok) { const e = new Error((j && (j.message || j.msg)) || `HTTP ${r.status}`); e.status = r.status; throw e; }
  return j;
}

/* pull, then push */
async function syncPull() {
  const sy = S.sync; let from = sy.cursor ? new Date(Date.parse(sy.cursor) - 10000).toISOString() : null, max = sy.cursor, applied = 0;
  for (let page = 0; page < 200; page++) { // 10 s overlap: commits can land slightly out of timestamp order; applying is idempotent
    const rows = await syncReq("GET", `/rest/v1/workspace_items?select=kind,id,data,deleted,client_updated_at,server_updated_at&order=server_updated_at.asc&limit=500${from ? `&server_updated_at=gte.${encodeURIComponent(from)}` : ""}`);
    applied += syncApply(rows);
    if (rows.length) { const last = rows[rows.length - 1].server_updated_at; if (!max || last > max) max = last; from = last; }
    if (rows.length < 500) break;
  }
  sy.cursor = max; sy.pulled = true;
  return applied;
}
async function syncPush() {
  const sy = S.sync, cur = syncRecords(), items = [], sent = [];
  sync.warn = 0;
  for (const [key, m] of Object.entries(sy.meta)) {
    if (!m.dirty) continue;
    const i = key.indexOf(":"), kind = key.slice(0, i), id = key.slice(i + 1);
    if (m.deleted) { items.push({ kind, id, data: {}, deleted: true, client_updated_at: m.u }); sent.push([key, m]); continue; }
    const rec = cur.get(key); if (!rec) continue;
    if (canon(rec.data).length > SYNC_MAX_ITEM) { m.dirty = false; sync.warn++; continue; } // too large for the database; kept local only
    items.push({ kind, id, data: rec.data, deleted: false, client_updated_at: m.u }); sent.push([key, m]);
  }
  let start = 0;
  while (start < items.length) {
    let end = start, size = 0;
    while (end < items.length && end - start < 200 && size + JSON.stringify(items[end]).length < 1500000) size += JSON.stringify(items[end++]).length;
    if (end === start) end++;
    await syncReq("POST", "/rest/v1/rpc/workspace_push", { items: items.slice(start, end) });
    for (const [key, m0] of sent.slice(start, end)) { const m = sy.meta[key]; if (m && m.h === m0.h && m.u === m0.u && !!m.deleted === !!m0.deleted) m.dirty = false; }
    start = end;
  }
  return items.length;
}

/* orchestration */
function ago(ts) { const m = Math.round((Date.now() - ts) / 60000); return m < 1 ? "just now" : m < 60 ? `${m} min ago` : `${Math.round(m / 60)} h ago`; }
function syncLabel() {
  if (!S.sync.session) return "Sync: off";
  const p = syncPending(), tail = p ? `, ${p} pending` : "";
  if (sync.state === "syncing") return "Sync: syncing...";
  if (sync.state === "offline") return `Sync: offline${tail}`;
  if (sync.state === "error") return `Sync: error${tail}`;
  return S.sync.lastSync ? `Synced ${ago(S.sync.lastSync)}${tail}` : "Sync: not yet synced";
}
function paintSync() {
  const a = $("#nav-sync"); if (a) a.textContent = syncLabel();
  const b = $("#sync-status"); if (b) b.textContent = syncLabel() + (sync.msg ? `. ${sync.msg}` : "");
}
function setSync(state, msg = "") { sync.state = state; sync.msg = msg; paintSync(); }
function scheduleSync(ms = 4000) { clearTimeout(sync.timer); if (syncActive() && S.sync.auto) sync.timer = setTimeout(() => syncRun(), ms); }
function syncTick(force) {
  if (!syncActive() || !S.sync.auto) return;
  if (force || syncPending() || !S.sync.lastSync || Date.now() - S.sync.lastSync > 300000) syncRun();
}
async function syncRun(manual) {
  if (!syncActive()) return;
  if (sync.busy) { sync.again = true; return; }
  sync.busy = true; setSync("syncing");
  try {
    syncDetect();
    const pulled = await syncPull();
    syncDetect();
    await syncPush();
    S.sync.stampNow = false; S.sync.lastSync = Date.now(); S.sync.lastError = "";
    setSync("idle", sync.warn ? `${sync.warn} record(s) too large to sync and kept on this device` : "");
    save();
    if (pulled) {
      const safe = ["dashboard", "tasks", "projects", "calendar", "insights"].includes(route) || (route === "library" && !routeArg);
      if (safe && !el$("dlg").open) render(); else toast(`${pulled} change(s) arrived from your other devices. Reopen this page to see them.`);
    } else if (manual) toast("Sync complete");
  } catch (e) {
    const offline = !!e.offline;
    S.sync.lastError = e.message; save();
    setSync(offline ? "offline" : "error", offline ? "" : e.message);
    if (manual) toast(offline ? "You appear to be offline. Changes will sync when you reconnect." : "Sync failed: " + e.message);
    if (!S.sync.session) { renderNav(); if (route === "settings") render(); }
  } finally {
    sync.busy = false;
    if (sync.again) { sync.again = false; scheduleSync(1500); }
  }
}

/* New passwords are checked against known breaches with the HaveIBeenPwned range API. Only the first 5 characters of the
   password's SHA-1 hash leave the device (k-anonymity); the matching happens here. This stands in for Supabase's leaked-password
   protection, which needs a paid plan. It is advisory: it cannot stop someone who calls the Auth API directly. */
const PWNED_TIMEOUT_MS = 5000;
async function pwnedCount(password) {
  const digest = await crypto.subtle.digest("SHA-1", new TextEncoder().encode(password));
  const hex = [...new Uint8Array(digest)].map((b) => b.toString(16).padStart(2, "0")).join("").toUpperCase();
  // One deadline covers both the request and reading the body, so a stalled service cannot hold sign-up open:
  // an abort lands in checkNewPassword's catch and sign-up continues with a notice.
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), PWNED_TIMEOUT_MS);
  try {
    const r = await netFetch("https://api.pwnedpasswords.com/range/" + hex.slice(0, 5), { headers: { "Add-Padding": "true" }, signal: ctl.signal });
    if (!r.ok) throw new Error(`Breach check returned HTTP ${r.status}`);
    for (const line of (await r.text()).split("\n")) { const [suffix, n] = line.trim().split(":"); if (suffix === hex.slice(5)) return Number(n) || 0; } // padded decoys have count 0
    return 0;
  } finally { clearTimeout(timer); }
}
async function checkNewPassword(password) {
  if (password.length < 10) throw new Error("Use at least 10 characters for a new password.");
  try {
    const n = await pwnedCount(password);
    if (n > 0) throw Object.assign(new Error(`That password appears in ${n.toLocaleString("en-GB")} known data breaches. Choose a different one.`), { breached: true });
  } catch (e) {
    if (e.breached) throw e;
    toast("Could not check the password against known breaches, so it was not checked."); // fail open: a down checker must not block sign-up
  }
}

/* account */
async function syncAuth(mode, email, password) {
  const url = normUrl(S.sync.url);
  if (!url) throw new Error("Enter your Supabase project URL, for example https://abcd.supabase.co");
  if (!S.sync.anonKey.trim()) throw new Error("Enter the project's publishable (anon) key");
  S.sync.url = url;
  if (mode === "signup") await checkNewPassword(password);
  const j = await syncAuthFetch(mode === "signup" ? "/auth/v1/signup" : "/auth/v1/token?grant_type=password", { email, password });
  if (!j.access_token) return { needsConfirm: true };
  const uid = j.user?.id;
  const hasData = S.tasks.length || S.projects.length || S.docs.length;
  if (S.sync.uid && S.sync.uid !== uid && hasData && !confirm("This browser holds data last synced with a different account. Upload it to this account?")) return { cancelled: true };
  if (S.sync.uid !== uid) { S.sync.meta = {}; S.sync.cursor = null; S.sync.pulled = false; S.sync.lastSync = null; }
  S.sync.uid = uid; S.sync.email = email; S.sync.session = toSession(j, email); save();
  setSync("idle"); renderNav();
  syncRun(true);
  return { ok: true };
}
async function syncSignOut() {
  try { if (S.sync.session) await syncAuthFetch("/auth/v1/logout", {}, S.sync.session.access_token); } catch { /* best effort */ }
  S.sync.session = null; save(); setSync("idle"); renderNav();
}
async function syncDeleteCloud() {
  await syncReq("DELETE", `/rest/v1/workspace_items?user_id=eq.${encodeURIComponent(S.sync.session.uid)}`, undefined, { prefer: "return=minimal" });
  S.sync.meta = {}; S.sync.cursor = null; S.sync.pulled = false; S.sync.lastSync = null; S.sync.auto = false; save(); setSync("idle");
}
function syncCard() {
  const sy = S.sync, upd = (fn) => (e) => { fn(e.target); save(); };
  const note = h("p", { class: "small muted" }, "Optional. Signs in to your own Supabase project and keeps tasks, projects, documents and settings in step across devices. Records are stored unencrypted in that project, protected by row-level security, so a person with admin access to the project could read them. Your Anthropic API key and sign-in tokens never sync. Setup: docs/SYNC.md.");
  if (!sy.session) {
    const email = h("input", { type: "email", autocomplete: "username", value: sy.email || "", "aria-label": "Email" }), pw = h("input", { type: "password", autocomplete: "current-password", "aria-label": "Password" });
    const act = (mode) => async (e) => {
      const b = e.target; if (!email.value.trim() || !pw.value) return toast("Enter your email and password");
      sy.email = email.value.trim(); b.disabled = true;
      try { const r = await syncAuth(mode, sy.email, pw.value); pw.value = ""; if (r.needsConfirm) toast("Check your email to confirm the account, then sign in."); else if (r.ok) { toast("Signed in"); render(); } }
      catch (err) { toast(err.offline ? "Could not reach the project URL. Check it and your connection." : err.message); }
      finally { b.disabled = false; }
    };
    return h("section", { class: "card" }, h("h3", {}, "Sync and account"), note,
      h("label", {}, "Project URL"), h("input", { value: sy.url, placeholder: "https://your-project.supabase.co", oninput: upd((t) => (sy.url = t.value.trim())) }),
      h("label", {}, "Publishable (anon) key"), h("input", { value: sy.anonKey, placeholder: "sb_publishable_... or the anon JWT", autocomplete: "off", oninput: upd((t) => (sy.anonKey = t.value.trim())) }),
      h("label", {}, "Email"), email, h("label", {}, "Password"), pw,
      h("div", { class: "row", style: "margin-top:12px" }, h("button", { class: "primary", onclick: act("signin") }, "Sign in"), h("button", { onclick: act("signup") }, "Create account")),
      h("p", { class: "small muted" }, "Signing in with an existing account on the project works; creating one adds a user to that project. New passwords need at least 10 characters and are checked against known breaches: only the first 5 characters of a hash are sent to api.pwnedpasswords.com."));
  }
  return h("section", { class: "card" }, h("h3", {}, "Sync and account"), note,
    h("p", {}, "Signed in as ", h("strong", {}, sy.session.email || "your account")), h("p", { class: "small", id: "sync-status", role: "status" }, syncLabel() + (sync.msg ? `. ${sync.msg}` : "")),
    h("p", {}, h("label", { class: "inline" }, h("input", { type: "checkbox", checked: sy.auto, onchange: (e) => { sy.auto = e.target.checked; save(); if (sy.auto) scheduleSync(500); } }), "Sync automatically")),
    h("div", { class: "row" }, h("button", { class: "primary", onclick: () => syncRun(true) }, "Sync now"), h("button", { onclick: async () => { await syncSignOut(); render(); toast("Signed out. Data on this device is kept."); } }, "Sign out"),
      h("button", { class: "danger", onclick: async () => { if (!confirm("Delete ALL your workspace data from the cloud? Data on this device is kept and automatic sync is switched off.")) return; try { await syncDeleteCloud(); render(); toast("Cloud data deleted"); } catch (err) { toast("Could not delete: " + err.message); } } }, "Delete cloud data")));
}

/* ---------- boot ---------- */
async function boot() {
  await DB.open();
  const saved = await DB.get("state"); if (saved) S = migrate(saved);
  addEventListener("hashchange", render);
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => S.settings.theme === "auto" && applyTheme());
  if (S.tasks.length === 0 && !saved) S.settings.onboardingDismissed = false;
  render(); checkReminders();
  setInterval(() => { checkReminders(); syncTick(); paintSync(); }, 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { checkReminders(); renderNav(); syncTick(true); } });
  addEventListener("online", () => syncTick(true));
  syncTick(true);
}
boot();
</script>
